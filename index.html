<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Dashboard | Aditya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #00e5ff;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #e0e0e0;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-block;
            background: #00c853;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 200, 83, 0.6);
        }

        .tech-stack {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .tech-badge {
            background: #333;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid #555;
        }
        
        .docker { color: #2496ED; border-color: #2496ED; }
        .git { color: #F05032; border-color: #F05032; }
        .jenkins { color: #D33833; border-color: #D33833; }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">● Live & Running</div>
        <h1>Hello DevOps! 🚀</h1>
        <p>This application is successfully deployed using an automated CI/CD pipeline.</p>
        
        <div class="tech-stack">
            <span class="tech-badge git">Git</span>
            <span class="tech-badge docker">Docker</span>
            <span class="tech-badge jenkins">Jenkins</span>
        </div>

        <footer>
            <p>Deployed by: <strong>Aditya</strong> | Build Version: <span id="version">v1.0</span></p>
        </footer>
    </div>

    <script>
        // Chhota sa JavaScript jo current time dikhayega
        const versionSpan = document.getElementById('version');
        const now = new Date();
        versionSpan.innerText = "v1.0." + now.getHours() + now.getMinutes();
    </script>

</body>
</html>
